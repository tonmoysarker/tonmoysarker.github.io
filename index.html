<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Tonmoy Sarker — Front-End Developer portfolio terminal. Type help to explore projects, skills, experience, and contact." />
  <meta name="theme-color" content="#ffb000" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Tonmoy Sarker" />
  <title>tonmoy@portfolio:~$</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='monospace' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="styles/terminal.css" />
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div class="crt-overlay" aria-hidden="true"></div>

  <div class="terminal-window" role="application" aria-label="Terminal portfolio">
    <div class="window-chrome">
      <div class="traffic-lights">
        <span class="light close" aria-label="Close"></span>
        <span class="light minimize" aria-label="Minimize"></span>
        <span class="light maximize" aria-label="Maximize"></span>
      </div>
      <div class="window-title">tonmoy@portfolio:~$</div>
    </div>

    <div class="terminal-body">
      <div class="terminal-output" id="terminal-output" role="log" aria-live="polite"></div>

      <div class="input-line" id="input-line" style="display: none;">
        <span class="prompt" id="prompt">tonmoy@portfolio:~$</span>
        <span class="cursor" id="cursor" aria-hidden="true">&#9608;</span>
        <input type="text" class="command-input" id="command-input" autocomplete="off" spellcheck="false" aria-label="Command input" />
      </div>
    </div>

    <div class="status-bar">
      <span class="status-item" id="status-time"></span>
      <span class="status-item">FPS: <span id="status-fps">60</span></span>
      <span class="status-item">MEM: <span id="status-mem">12.4M</span></span>
      <span class="status-item right">INSERT</span>
    </div>
  </div>

  <footer class="terminal-footer" role="contentinfo">
    <p>Built with vanilla JS · <a href="https://github.com/tonmoysarker" target="_blank" rel="noopener">github.com/tonmoysarker</a> · <kbd>&#8593;</kbd><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8595;</kbd><kbd>&#8592;</kbd><kbd>&#8594;</kbd><kbd>&#8592;</kbd><kbd>&#8594;</kbd><kbd>B</kbd><kbd>A</kbd> for easter egg</p>
  </footer>

  <script src="scripts/main.js"></script>
</body>
</html>
